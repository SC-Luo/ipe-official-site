/* =========================================
   IPE 旗艦版頁尾樣式 (Premium Corporate Footer)

.ipe-footer-wrap {
    --ipe-gold: #C6A96B;
    --ipe-gold-light: #D8BE8A;
    --ipe-gold-dark: #B89A5F;
    --ipe-navy: #1B2836;
    --ipe-navy-light: #2C3E50;
    --ipe-text-main: #FFFFFF;
    --ipe-text-sub: #A0AAB5;
    
    background: linear-gradient(180deg, var(--ipe-navy) 0%, #15202B 100%);
    color: var(--ipe-text-sub);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    
    /* 🚨 關鍵修改 1：移除上方圓角，僅保留下方圓角，使其能與上方白底無縫接合 */
    border-radius: 0 0 20px 20px; 
    position: relative;
    overflow: hidden; 
    padding: 70px 0 30px 0;
    /* 🚨 關鍵修改 2：將原本的 margin-top: 60px 改為 0，消除灰色斷層 */
    margin-top: 0; 
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 10px 40px rgba(0,0,0,0.05); /* 調整陰影方向與主內容一致 */
}

/* 頂部極細金色光感飾條 */
.ipe-footer-wrap::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--ipe-gold-dark) 0%, var(--ipe-gold-light) 50%, var(--ipe-gold-dark) 100%);
    /* 🚨 關鍵修改 3：配合無縫設計，將金線的圓角完全移除 */
    border-radius: 0; 
}
.ipe-footer-container {
    max-width: 1200px;

    grid-template-columns: 2.2fr 1fr 1.5fr;

}

.footer-brand h2 {

}

.footer-brand p {

}

.footer-social {

}
.footer-social a {

    color: var(--ipe-text-main);
    border-radius: 50%;
    text-decoration: none;
    transition: all 0.3s ease;
    font-size: 16px;
}
.footer-social a:hover {
    background: var(--ipe-gold);
    border-color: var(--ipe-gold);
    transform: translateY(-4px);
    box-shadow: 0 5px 15px rgba(198, 169, 107, 0.3);
}

.footer-title {

    color: var(--ipe-gold);

    font-weight: 700;
    margin: 0 0 25px 0;

}

.footer-links {
    list-style: none;
    padding: 0;
    margin: 0;
}
.footer-links li {
    margin-bottom: 18px; /* 稍微增加行距讓 4 個選項更大氣 */
}
.footer-links a {
    color: var(--ipe-text-sub);
    text-decoration: none;
    font-size: 15px;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
}
.footer-links a::before {
    content: '\f105';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    font-size: 12px;
    margin-right: 8px;
    color: var(--ipe-gold-dark);
    transition: all 0.3s ease;

}
.footer-links a:hover {
    color: var(--ipe-gold-light);
}
.footer-links a:hover::before {

}

.footer-contact {

}
.footer-contact a:hover {
    color: var(--ipe-gold-light);
}

.footer-bottom {
    max-width: 1200px;

    padding: 25px 40px 0 40px;

}
.footer-bottom-links a {
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    margin-left: 20px;
    transition: color 0.3s;
}
.footer-bottom-links a:hover {
    color: var(--ipe-gold);
}

@media (max-width: 992px) {

        text-align: center;
        padding-left: 30px;
        padding-right: 30px;
    }
    .footer-bottom-links a {
        margin: 0 10px;
    }
}
